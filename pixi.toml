[workspace]
name = "image_reader"
version = "1.0.0"
description = "High-performance Mojo-native image decoding library"
authors = ["AlexALX"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = ">=1.0"

[pypi-options]
no-build-isolation = ["image-reader"]

[tasks]
cli = "mojo run image_reader/main.mojo"
build = { cmd = "mkdir -p build && mojo build image_reader/main.mojo -o build/image_reader" }
test = "mojo run tests/run_tests.mojo"
